name: Paper Trade Rebalance (Earnings)

on:
  schedule:
    # The slots of rebalance.yml, thirty minutes later (see the note there on
    # scheduler delay); five attempts a day, each idempotent. Every weekday,
    # although the book only trades every five sessions: a run on another day
    # records the account and exits.
    - cron: '7 10 * * 1-5'
    - cron: '7 11 * * 1-5'
    - cron: '7 12 * * 1-5'
    - cron: '7 13 * * 1-5'
    - cron: '7 15 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'live'
        type: choice
        options:
          - live
          - dry-run
          - dry-run-force
          - status

permissions:
  contents: write

# One group per book.  The three books trade separate Alpaca accounts and
# separate state files, so they never needed to wait for each other, and a
# shared group was worse than waiting: GitHub keeps only one pending run per
# group, so when a third run queued behind a running one, the second was
# cancelled.  Within a book, queued live runs are preserved rather than
# cancelled mid-order, and the commit step retries its push if another
# book's state commit lands first.
concurrency:
  group: paper-trading-earnings-${{ github.repository }}
  cancel-in-progress: false

jobs:
  rebalance:
    # Pinned: ubuntu-latest moved to 26.04 on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # The state file comes from git, the only record (the cache that used
      # to be restored here overwrote hand-fixed state in runs 39656660013
      # and 39672205189).  ref: resolves the branch tip when the job starts
      # rather than the commit the schedule fired on, so a run that queued
      # behind another one of this book sees the state that run committed.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install --require-hashes -r requirements.lock

      - name: Ensure logs directory
        run: mkdir -p logs

      # Determine run flags
      - name: Set run flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            MODE="live"
          fi
          if [ "$MODE" = "live" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Live paper trading is allowed only from main; got $GITHUB_REF" >&2
            exit 2
          fi
          case "$MODE" in
            dry-run)       echo "args=--dry-run"         >> "$GITHUB_OUTPUT" ;;
            # Full pipeline smoke test: computes the target portfolio and
            # previews trades even when a rebalance is not due; never submits.
            dry-run-force) echo "args=--dry-run --force" >> "$GITHUB_OUTPUT" ;;
            status)        echo "args=--status"          >> "$GITHUB_OUTPUT" ;;
            *)             echo "args="                  >> "$GITHUB_OUTPUT" ;;
          esac

      # The earnings book trades the paper account the trend book had: the
      # owner retired the trend book on 2026-10-22 as the lowest actual
      # paper return of the three (100,000 on 2026-09-17, 92,707 on 10/22),
      # and rebalance-trend.yml is disabled and refuses live runs.  Its keys
      # are ALPACA_TREND_* or, as the trend workflow read them, the legacy
      # ALPACA_CLAUDE_*.  Scheduled runs start on 2026-10-23, the date the
      # owner was told the first order would go in; a manual dry run works
      # before that.  Without keys the run stands down with a warning (no
      # failure mail, per the owner) rather than let the script trace back.
      - name: Check the account keys are configured
        id: keys
        env:
          ALPACA_EARNINGS_API_KEY: ${{ secrets.ALPACA_TREND_API_KEY || secrets.ALPACA_CLAUDE_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [[ "$(date -u +%F)" < "2026-10-23" ]]; then
            echo "::notice::The earnings book takes over the trend account on 2026-10-23; scheduled runs wait until then"
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$ALPACA_EARNINGS_API_KEY" ]; then
            echo "::warning::Earnings account keys missing (the trend account's ALPACA_TREND_* or ALPACA_CLAUDE_*); standing down"
            echo "STAND_DOWN:missing_keys at $(date -u +%H:%M) UTC: earnings account keys are not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run paper_trade_earnings.py
        if: steps.keys.outputs.present == 'true'
        run: |
          set -o pipefail
          python paper_trade_earnings.py ${{ steps.flags.outputs.args }} 2>&1 | tee run.log
        env:
          PYTHONPATH: .
          ALPACA_EARNINGS_API_KEY: ${{ secrets.ALPACA_TREND_API_KEY || secrets.ALPACA_CLAUDE_API_KEY }}
          ALPACA_EARNINGS_SECRET_KEY: ${{ secrets.ALPACA_TREND_SECRET_KEY || secrets.ALPACA_CLAUDE_SECRET_KEY }}

      # A run that could not do its job is marked, not failed: the owner
      # asked for no failure mail (2026-10-22), so a stand-down shows as a
      # warning annotation and in the job summary.  A traceback (a held lock,
      # a data error on a rebalance day, Yahoo's earnings calendar
      # unavailable) still fails the step above, since that is a broken run.
      # paper_trade_common.py prints one marker line at each stand-down site:
      # FULL_DAY_MARKET_CLOSED when every attempt of the day found the market
      # closed, STAND_DOWN:<reason> for a drawdown-gate breach, orders left
      # open by an earlier run, the daily-loss kill-switch or missing broker
      # quotes.  A single early or late arrival that finds the market closed
      # only warns too, since the other slots retry, and a quiet in-session
      # run ("Not time to rebalance yet") stays silent.
      - name: Flag a run that stood down
        run: |
          markers="$(grep -oE 'FULL_DAY_MARKET_CLOSED|STAND_DOWN:[A-Za-z0-9_]+' run.log | sort -u || true)"
          if [ -n "$markers" ]; then
            echo "::warning::Run stood down: $(echo "$markers" | tr '\n' ' ')"
            {
              echo "## Run stood down at $(date -u +%H:%M) UTC"
              echo '```'
              echo "$markers"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "Market is closed" run.log; then
            echo "::warning::Scheduled run landed outside market hours (scheduler delay); no stop-loss check or rebalance from this attempt, the other slots retry"
            echo "Scheduled run at $(date -u +%H:%M) UTC found the market closed." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Commit updated trade logs and state back to repo
      # always(): a run that traded and then failed must still land its
      # state and event log on main; git is the only record of the state.
      - name: Commit trade logs
        if: always() && github.ref == 'refs/heads/main' && github.event.inputs.mode != 'dry-run' && github.event.inputs.mode != 'dry-run-force' && github.event.inputs.mode != 'status'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f logs/paper_trade_earnings_state.json logs/trade_events_earnings.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: update earnings trade state after rebalance [skip ci]"
            # Another book may push its own state commit in the meantime; rebase
            # ours on top and retry rather than fail the job.
            pushed=0
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "State push attempt $attempt failed; retrying"
              sleep $((attempt * 5))
            done
            if [ "$pushed" != 1 ]; then
              echo "::error::Could not push the state commit after 4 attempts"
              exit 1
            fi
          fi
