name: Research

# Runs one script from research/ on Actions, so no research computation
# (data pulls, factor studies, candidate backtests) runs on a local machine.
# Manual trigger only; no Alpaca keys, no commits.  Whatever the script
# prints goes to the job summary, and anything it writes under research/out
# is uploaded as an artifact.

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script under research/ to run (e.g. edgar_probe.py)'
        required: true
        default: 'edgar_probe.py'
      args:
        description: 'Arguments passed to the script'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install --require-hashes -r requirements.lock

      - name: Run the research script
        env:
          PYTHONPATH: .
          SCRIPT: ${{ github.event.inputs.script }}
          ARGS: ${{ github.event.inputs.args }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: |
          if ! [[ "$SCRIPT" =~ ^[A-Za-z0-9_][A-Za-z0-9_/-]*\.py$ ]] || [ ! -f "research/$SCRIPT" ]; then
            echo "No such research script: $SCRIPT" >&2
            exit 2
          fi
          mkdir -p research/out
          set -o pipefail
          # shellcheck disable=SC2086
          python "research/$SCRIPT" $ARGS 2>&1 | tee research/out/log.txt

      - name: Publish the output to the job summary
        if: always()
        env:
          SCRIPT: ${{ github.event.inputs.script }}
          ARGS: ${{ github.event.inputs.args }}
        run: |
          {
            echo "# research/$SCRIPT $ARGS"
            echo ""
            echo '```'
            tail -c 60000 research/out/log.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-${{ github.run_id }}
          path: research/out/
          if-no-files-found: ignore
