name: Trend Backtest

# Manual only. Runs the trend strategy (config_trend.yaml) over a window and
# prints the metrics and calendar-year returns to the job log and the step
# summary. Iterating on the strategy happens here, not on a laptop: the same
# pinned dependencies and the same data path as the live runner.

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Start date (YYYY-MM-DD); default five years ago'
        required: false
        default: ''
      end:
        description: 'End date (YYYY-MM-DD); default today'
        required: false
        default: ''
      overrides:
        description: 'JSON merged over config_trend.yaml, e.g. {"trend": {"trailing_stop": 0.2}}'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install --require-hashes -r requirements.lock

      - name: Run the trend backtest
        env:
          PYTHONPATH: .
        run: |
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          if [ -z "$START" ]; then
            START=$(python -c "from datetime import date; from dateutil.relativedelta import relativedelta; print((date.today() - relativedelta(years=5)).isoformat())")
          fi
          ARGS=(--start "$START" --yearly --plot --plot-output backtest_trend.png)
          if [ -n "$END" ]; then ARGS+=(--end "$END"); fi
          OVERRIDES='${{ github.event.inputs.overrides }}'
          if [ -n "$OVERRIDES" ]; then ARGS+=(--override "$OVERRIDES"); fi
          python run.py -c config_trend.yaml backtest-trend "${ARGS[@]}" | tee backtest_output.txt
          {
            echo '## Trend backtest'
            echo
            echo '```'
            grep -vE '^\s*$' backtest_output.txt | grep -vE 'INFO|WARNING' | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trend-backtest
          path: |
            backtest_output.txt
            backtest_trend.png
          if-no-files-found: warn
