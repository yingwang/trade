# Fourth paper account: the earnings book (quant/earnings_strategy.py).
#
# Universe: the S&P 500 by its membership history (data/universe/sp500_history.csv,
# downloaded from the public fja05680/sp500 table when missing). The strategy
# replaces universe.symbols below at runtime: the backtest with every name that
# was a member since its start, the live path with the latest snapshot.
#
# Signals and parameters were chosen on 2026-10-22 from research/factor_lab.py,
# research/earnings_lab.py and research/composite_lab.py: the composite of the
# consensus earnings surprise, year-on-year EPS growth, distance to the next
# announcement and 12-6 month momentum was the one ranking with a positive
# 21-day IC in every sub-period since 2010 on that universe. The portfolio
# rules are the trend book's.

