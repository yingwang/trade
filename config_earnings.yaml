data:
  lookback_years: 5
  frequency: 1d

# The signals block exists to satisfy the shared config validator and the
# warm-up arithmetic; EarningsStrategy computes its own series.
signals:
  momentum_windows: [126, 252]
  mean_reversion_window: 20
  mean_reversion_zscore_threshold: 4.0
  sma_short: 50
  sma_long: 200
  volatility_window: 63
  industry_neutral: false
  winsorize_clip: 3.0
  factor_weights:
    momentum: 1.0

earnings:
  universe_file: data/universe/sp500_history.csv
  universe_lead_days: 400      # a backtest also loads names that left the index up to this long before its start
  weights:                      # averaged after z-scoring; a missing part counts as zero
    sue: 1.0                    # consensus earnings surprise, standardized by the last 8 errors
    eps_growth: 1.0             # reported EPS against the same quarter a year earlier
    days_to_next: 1.0           # names about to report rank first
    momentum: 1.0               # 12-6 month return
  momentum_lookback: 252
  momentum_skip: 126
  sue_lookback: 8
  min_parts: 2                  # a name needs at least two of the four parts
  sizing: equal                 # equal (the research book) or inverse_vol (the trend book's)
  fixed_gross: 1.0              # hold this times equity (capped by the regime and leverage caps); null = volatility target
  require_uptrend: false        # true: only names above their 200-day average are ranked
  earnings_limit: 100           # announcements per name requested from Yahoo
  positions: 25
  rank_buffer: 40               # a holding stays while still inside the top 40
  # Stops and regime lights are off: on this ranking each of them cost return
  # in the 2026-10-22 variants (see quant/earnings_strategy.py). The engine
  # and the live runner read 0 as "no fixed stop".
  vol_window: 60
  sma_long: 200
  sma_short: 50
  trailing_stop: 0.0            # 0 = no trailing stop
  trailing_window: 60
  reentry_cooldown_sessions: 5
  benchmark_vol_window: 21
  benchmark_vol_high: 0.30
  breadth_min: 0.30
  regime_caps:                  # gross exposure by number of lights on; null = no cap
    0: null
    1: null
    2: null
  deleverage_tolerance: 0.10

portfolio:
  max_positions: 25
  max_position_weight: 0.08     # of the unlevered sleeve (25 equal weights of 4%)
  min_position_weight: 0.01
  target_volatility: 0.25       # only used when earnings.fixed_gross is null
  rebalance_frequency_days: 5   # every five sessions on the shared anchored calendar
  transaction_cost_bps: 10
  max_turnover_per_rebalance: 1.0
  exit_turnover_share: 1.0
  allocation: proportional
  alpha_scale: 0.05
  risk_aversion: 1.0

risk:
  max_drawdown_limit: 0.30
  max_sector_weight: 1.0
  stop_loss_pct: 0.0            # no fixed stop (engine and runner treat 0 as off)

leverage:
  max_leverage: 1.0             # 1.3x gave 2010-2026 CAGR 17.2% with a 47% drawdown, 1.5x 18.4% / 53%
  regime_spy_vol_window: 21
  regime_thresholds:
    low: 0.12
    high: 0.30
  regime_leverage_caps:
    low_vol: 1.0
    normal: 1.0
    high_vol: 0.6
  margin_annual_rate: 0.06

attribution:
  lookback_days: 252
  min_observations: 60
  annual_cash_return: 0.0

safety:
  max_single_order_value: 60000
  max_single_order_shares: 10000
  max_daily_trade_value: 600000
  max_daily_loss: 25000
  max_adv_fraction: 0.01
  min_price: 1.0
  max_position_pct_of_portfolio: 0.15   # 25 names at 1.0x gross: 0.08 with room for drift
  require_paper_mode: true

backtest:
  rebalance_anchor_date: "2000-01-03"
  start_date: "2010-01-01"
  end_date: null
  initial_capital: 100000
  slippage_bps: 5
  market_impact_coeff: 2.5
  market_impact_sigma_coeff: 1.0
  risk_free_rate: 0.04
